# Publication de l'analyzer comme composant téléchargé.
#
# MANUELLE, et c'est délibéré : l'analyzer ne change que dans une release sur
# deux environ, et par salves. Le construire et le publier à chaque release
# repousserait 370 Mo pour rien. On publie quand il change ; le manifeste
# committé (electron/config/components.json) fige ensuite ce que l'app utilise.
#
# Chaque job affiche l'entrée de manifeste à coller. Rien n'est commité
# automatiquement : changer l'analyzer que reçoivent les utilisateurs doit
# rester un acte explicite et relu.
name: Publish analyzer component

on:
    workflow_dispatch:
        inputs:
            macos_arm64:
                description: 'macOS Apple Silicon'
                type: boolean
                default: true
            macos_intel:
                description: 'macOS Intel'
                type: boolean
                default: true
            windows:
                description: 'Windows'
                type: boolean
                default: true
            linux:
                description: 'Linux'
                type: boolean
                default: true

env:
    S3_ENDPOINT: https://storage.ebp.gg
    S3_BUCKET: public
    S3_PREFIX: tools/components/analyzer
    # MinIO ignore la région, mais l'AWS CLI refuse de démarrer sans.
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCESS_KEY_ID: ${{ secrets.COMPONENTS_S3_ACCESS_KEY }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.COMPONENTS_S3_SECRET_KEY }}

jobs:
    macos-arm64:
        if: ${{ inputs.macos_arm64 }}
        runs-on: macos-latest
        outputs:
            entry: ${{ steps.publish.outputs.entry }}
        steps:
            - uses: actions/checkout@v4

            - name: Import Code-Signing Certificates
              uses: Apple-Actions/import-codesign-certs@v3
              with:
                  p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
                  p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

            - name: Install Tesseract
              run: brew install tesseract pkg-config

            - name: Build analyzer
              run: cd python && bash build.sh

            # Garde-fou historique : un défaut d'empaquetage fait retomber
            # silencieusement l'OCR sur pytesseract, bien plus lent.
            - name: Verify packaged binary uses tesserocr
              run: |
                  binaries/analyzer/darwin/darwin selftest || {
                    echo "::error::Le binaire n'utilise PAS tesserocr"
                    exit 1
                  }

            # Signature en cascade : les dylibs d'abord, l'exécutable ensuite.
            # Elle est embarquée dans le Mach-O, donc elle survit à l'archivage.
            # `--timestamp` fait un aller-retour chez Apple PAR fichier, et il y
            # en a plus de 300. Un seul timeout — la machine physique s'assoupit,
            # le service répond en 10 s au lieu de 0,2 — et `bash -e` faisait
            # tomber les cinq minutes de build : quatre échecs de suite le
            # 08/09/2026, chaque fois sur un fichier différent (le 1er, le 4e, le
            # 216e). À 1 % d'échec par appel, les 300 ne passent que 5 fois sur
            # 100 ; avec trois tentatives, plus de 99,99 %.
            - name: Sign analyzer
              run: |
                  sign() {
                    for TRY in 1 2 3; do
                      codesign --force --sign "Developer ID Application: Antoine Duval (5DQ59NSHNB)" \
                        --options runtime --entitlements build/entitlements.plist --timestamp "$1" && return 0
                      echo "::warning::signature de $1 échouée (tentative $TRY/3), nouvel essai"
                      sleep 5
                    done
                    echo "::error::signature de $1 échouée après 3 tentatives"
                    return 1
                  }
                  find binaries/analyzer/darwin -type f \( -name "*.dylib" -o -name "*.so" \) | while read f; do
                    sign "$f" || exit 1
                  done
                  sign binaries/analyzer/darwin/_internal/tesseract/tesseract
                  sign binaries/analyzer/darwin/darwin

            - name: Publish
              id: publish
              run: bash .github/scripts/publish-component.sh darwin-arm64 binaries/analyzer/darwin darwin/darwin

    macos-intel:
        if: ${{ inputs.macos_intel }}
        runs-on: self-hosted
        outputs:
            entry: ${{ steps.publish.outputs.entry }}
        steps:
            - uses: actions/checkout@v4

            # Le runner Intel est une machine physique : son python3 système
            # est celui d'Xcode, bloqué en 3.9 avec pip 21. Les dépendances
            # épinglées exigent >= 3.12 — sans cette étape, l'installation
            # s'arrête sur « No matching distribution found for numpy==2.5.1 ».
            # Les runners GitHub, eux, arrivent avec un Python récent, d'où
            # l'absence de cette étape sur le job Apple Silicon.
            # Python par Homebrew, et NON par `setup-python` comme les autres
            # jobs : le script d'installation du paquet macOS vise
            # /Users/runner/hostedtoolcache, chemin en dur des runners GitHub.
            # Il ignore AGENT_TOOLSDIRECTORY — vérifié, la variable était bien
            # renseignée et il a quand même échoué sur « mkdir: /Users/runner:
            # Permission denied ». Cette machine étant physique, ce chemin ne
            # peut pas exister.
            #
            # `libexec/bin` fournit les liens non versionnés `python3`/`pip3`,
            # que `build.sh` utilise pour créer son venv.
            - name: Install Python 3.12
              run: |
                  brew install python@3.12
                  echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"

            # Les runners self-hosted gardent leur état : le trousseau créé au
            # run précédent ferait échouer l'import.
            - name: Clean up leftover signing keychain
              run: security delete-keychain signing_temp.keychain 2>/dev/null || true

            - name: Import Code-Signing Certificates
              uses: Apple-Actions/import-codesign-certs@v3
              with:
                  p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
                  p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

            - name: Install Tesseract
              run: brew install tesseract pkg-config

            - name: Build analyzer
              run: cd python && bash build.sh

            - name: Verify packaged binary uses tesserocr
              run: |
                  binaries/analyzer/darwin/darwin selftest || {
                    echo "::error::Le binaire n'utilise PAS tesserocr"
                    exit 1
                  }

            # `--timestamp` fait un aller-retour chez Apple PAR fichier, et il y
            # en a plus de 300. Un seul timeout — la machine physique s'assoupit,
            # le service répond en 10 s au lieu de 0,2 — et `bash -e` faisait
            # tomber les cinq minutes de build : quatre échecs de suite le
            # 08/09/2026, chaque fois sur un fichier différent (le 1er, le 4e, le
            # 216e). À 1 % d'échec par appel, les 300 ne passent que 5 fois sur
            # 100 ; avec trois tentatives, plus de 99,99 %.
            - name: Sign analyzer
              run: |
                  sign() {
                    for TRY in 1 2 3; do
                      codesign --force --sign "Developer ID Application: Antoine Duval (5DQ59NSHNB)" \
                        --options runtime --entitlements build/entitlements.plist --timestamp "$1" && return 0
                      echo "::warning::signature de $1 échouée (tentative $TRY/3), nouvel essai"
                      sleep 5
                    done
                    echo "::error::signature de $1 échouée après 3 tentatives"
                    return 1
                  }
                  find binaries/analyzer/darwin -type f \( -name "*.dylib" -o -name "*.so" \) | while read f; do
                    sign "$f" || exit 1
                  done
                  sign binaries/analyzer/darwin/_internal/tesseract/tesseract
                  sign binaries/analyzer/darwin/darwin

            # Machine physique : contrairement aux runners GitHub, l'AWS CLI
            # n'y est pas préinstallée. Le binaire se construisait donc jusqu'au
            # bout — archive de 130 Mo — avant d'échouer sur « aws: command not
            # found », soit après dix minutes de compilation pour rien.
            - name: Install AWS CLI
              run: brew install awscli

            - name: Publish
              id: publish
              run: bash .github/scripts/publish-component.sh darwin-x64 binaries/analyzer/darwin darwin/darwin

    linux:
        if: ${{ inputs.linux }}
        runs-on: ubuntu-22.04
        outputs:
            entry: ${{ steps.publish.outputs.entry }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  # 3.12 comme sous Windows : numpy et scipy épinglés exigent
                  # >= 3.12, et aligner les interpréteurs supprime une variable.
                  python-version: '3.12'

            - name: Install Tesseract eng data
              run: sudo apt-get update && sudo apt-get install -y tesseract-ocr-eng zip

            - name: Build analyzer
              run: cd python && bash build_linux.sh

            - name: Publish
              id: publish
              run: bash .github/scripts/publish-component.sh linux binaries/analyzer/linux linux/linux

    windows:
        if: ${{ inputs.windows }}
        runs-on: windows-2022
        outputs:
            entry: ${{ steps.publish.outputs.entry }}
        steps:
            - uses: actions/checkout@v4

            # La roue tesserocr préconstruite est en cp312 : l'interpréteur doit
            # correspondre, tesserocr ne compilant pas depuis les sources ici.
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install Tesseract
              run: choco install tesseract --no-progress -y

            - name: Build analyzer
              run: cd python && .\build.bat

            - name: Verify packaged binary uses tesserocr
              shell: pwsh
              run: |
                  & "binaries\analyzer\win32.exe" selftest
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "Le binaire n'utilise PAS tesserocr (exit $LASTEXITCODE)"
                    exit 1
                  }

            # Windows livre un exécutable unique, déjà compressé par PyInstaller :
            # l'archiver n'apporterait rien. Pas de dossier, donc pas d'`exec`.
            - name: Publish
              id: publish
              shell: bash
              run: bash .github/scripts/publish-component.sh win32 binaries/analyzer/win32.exe

    manifest:
        needs: [macos-arm64, macos-intel, linux, windows]
        # `always()` : on publie rarement les quatre plateformes à la fois, et un
        # job non demandé est « skipped » — sans ça le récapitulatif ne sortirait
        # jamais.
        if: ${{ always() }}
        runs-on: ubuntu-latest
        steps:
            - name: Assemble manifest entries
              run: |
                  {
                    echo '## Entrées à coller dans `electron/config/components.json`'
                    echo
                    echo '```json'
                    echo '"analyzer": {'
                    for E in '${{ needs.macos-arm64.outputs.entry }}' \
                             '${{ needs.macos-intel.outputs.entry }}' \
                             '${{ needs.linux.outputs.entry }}' \
                             '${{ needs.windows.outputs.entry }}'; do
                      [ -n "$E" ] && echo "    $E"
                    done
                    echo '}'
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
