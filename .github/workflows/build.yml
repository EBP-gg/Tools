permissions:
    contents: write

name: Build Windows, macOS and Linux binaries

# Une build interroge pour ses mises à jour le dépôt qui l'a produite : sur le
# banc d'essai elle reste isolée, sur le dépôt de production la valeur retombe
# d'elle-même sur la production. Rien à surcharger à la main, et rien de
# dangereux à fusionner d'un dépôt vers l'autre.
env:
    TOOLS_UPDATE_REPOSITORY: ${{ github.repository }}
    # Flux Squirrel.Windows auto-hébergé. Publié dès maintenant, mais AUCUN
    # client ne le lit encore : on veut d'abord constater que les paquets delta
    # sont produits, avant d'y brancher l'updater.
    S3_ENDPOINT: https://storage.ebp.gg
    S3_BUCKET: public
    # Un flux PAR DÉPÔT : sans ça les versions du banc d'essai et celles de la
    # production partageraient le même RELEASES, et un client de prod se verrait
    # proposer une version de test. Le client dérive la même URL de la même
    # variable (cf. constants.js), donc les deux ne peuvent pas diverger.
    FEED_PREFIX: tools/updates/${{ github.repository }}/win32
    AWS_DEFAULT_REGION: us-east-1
    # Les clés S3 écrivent le flux de mise à jour que tous les clients installés
    # interrogent. Elles ne sont donc PAS déclarées ici : au niveau du workflow,
    # elles seraient dans l'environnement de `npm install` et de chaque étape qui
    # compile ou exécute du code tiers. Elles sont posées étape par étape, sur
    # les seules qui publient.

# The CICD will be launched for each tag created.
on:
    push:
        tags:
            - '*'

jobs:
    # Run Jest tests.
    test:
        runs-on: ubuntu-latest
        steps:
            # Clone the repository.
            - uses: actions/checkout@v4
            # Verify that the tag matches the version in package.json.
            - name: Verify tag matches package.json version
              run: |
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
                    echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$PKG_VERSION'."
                    exit 1
                  fi
            # Install Node.js.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
            # Install NPM dependencies.
            - name: Install Node dependencies
              run: npm run install_npm
            # Validate translation files.
            - name: Validate translations
              run: node scripts/validate-translations.js
            # Run Jest tests.
            - name: Run tests
              run: npm test

    # Create the MacOS ARM64 (Apple Silicon) version of the application.
    build-macos-arm64:
        runs-on: macos-latest
        needs: [test]
        env:
            # Un flux par ARCHITECTURE : sans ça un Mac Intel se verrait
            # proposer une app Apple Silicon, qui ne démarrerait pas.
            SQUIRREL_MAC_MANIFEST_BASE_URL: https://storage.ebp.gg/public/tools/updates/${{ github.repository }}/darwin-arm64
            APPLE_ID: ${{ secrets.APPLE_ID }}
            APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        steps:
            # Clone the repository.
            - uses: actions/checkout@v4

            # Import Apple certificate
            - name: Import Code-Signing Certificates
              uses: Apple-Actions/import-codesign-certs@v3
              with:
                  p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
                  p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

            # Install Node.js.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            # Install NPM dependencies.
            - name: Install Node dependencies
              run: npm run install_npm

            # Building Angular and making the Electron application.
            # Une plateforme absente du manifeste produirait une application
            # qui ne démarre pas : getComponentPath lève au chargement des
            # constantes, avant la moindre fenêtre.
            - name: Verify components manifest
              run: node scripts/check-components.js darwin-arm64
            - name: Build Electron app
              run: npm run make

            # Publication du flux Squirrel.Mac. AUCUN client ne le lit encore :
            # on veut d'abord constater que l'archive et le manifeste sortent
            # correctement avant d'y brancher l'updater.
            - name: Publish macOS feed
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.COMPONENTS_S3_ACCESS_KEY }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.COMPONENTS_S3_SECRET_KEY }}
              run: bash .github/scripts/publish-mac-feed.sh arm64

            # Rename the created binary.
            - name: Rename .dmg
              run: |
                  file=$(find out/make -type f -name "*.dmg" | head -n 1)
                  mv "$file" out/make/EBP-Tools-${GITHUB_REF_NAME}-arm64.dmg

            # Generate update metadata files
            - name: Generate update metadata
              run: node scripts/generate-update-metadata.js ${GITHUB_REF_NAME} darwin arm64

            # Upload the created binary.
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: macos-arm64
                  path: |
                      out/make/*.dmg
                      out/make/*.zip
                      out/make/latest-mac.yml

    # Create the MacOS x64 (Intel) version of the application.
    # Runs on a self-hosted Intel Mac runner since GitHub no longer offers
    # hosted Intel macOS runners on recent images.
    build-macos-intel:
        runs-on: self-hosted
        needs: [test]
        env:
            # Un flux par ARCHITECTURE : sans ça un Mac Intel se verrait
            # proposer une app Apple Silicon, qui ne démarrerait pas.
            SQUIRREL_MAC_MANIFEST_BASE_URL: https://storage.ebp.gg/public/tools/updates/${{ github.repository }}/darwin-x64
            APPLE_ID: ${{ secrets.APPLE_ID }}
            APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        steps:
            # Clone the repository.
            - uses: actions/checkout@v4

            # Self-hosted runners persist state between runs. The
            # import-codesign-certs action creates a `signing_temp.keychain`
            # every run and fails if one already exists from a previous build,
            # so we clear any leftover keychain before importing.
            - name: Clean up leftover signing keychain
              run: security delete-keychain signing_temp.keychain 2>/dev/null || true

            # Import Apple certificate
            - name: Import Code-Signing Certificates
              uses: Apple-Actions/import-codesign-certs@v3
              with:
                  p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
                  p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

            # Install Node.js.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            # Install NPM dependencies.
            - name: Install Node dependencies
              run: npm run install_npm

            # Building Angular and making the Electron application.
            # Une plateforme absente du manifeste produirait une application
            # qui ne démarre pas : getComponentPath lève au chargement des
            # constantes, avant la moindre fenêtre.
            - name: Verify components manifest
              run: node scripts/check-components.js darwin-x64
            - name: Build Electron app
              run: npm run make

            # Publication du flux Squirrel.Mac. AUCUN client ne le lit encore :
            # on veut d'abord constater que l'archive et le manifeste sortent
            # correctement avant d'y brancher l'updater.
            - name: Publish macOS feed
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.COMPONENTS_S3_ACCESS_KEY }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.COMPONENTS_S3_SECRET_KEY }}
              run: bash .github/scripts/publish-mac-feed.sh x64

            # Rename the created binary.
            - name: Rename .dmg
              run: |
                  file=$(find out/make -type f -name "*.dmg" | head -n 1)
                  mv "$file" out/make/EBP-Tools-${GITHUB_REF_NAME}-x64.dmg

            # Generate update metadata files
            - name: Generate update metadata
              run: node scripts/generate-update-metadata.js ${GITHUB_REF_NAME} darwin x64

            # Upload the created binary.
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: macos-x64
                  path: |
                      out/make/*.dmg
                      out/make/*.zip
                      out/make/latest-mac.yml

    # Create the Windows version of the application.
    # Pinned to windows-2022 (Visual Studio 2022 / v17). windows-latest now maps
    # to the win25-vs2026 image (Visual Studio 2026 / v18), which the node-gyp
    # bundled with Electron does not recognize ("unsupported version: 18"),
    # breaking the native build of registry-js.
    build-windows:
        runs-on: windows-2022
        needs: [test]
        steps:
            # Clone the repository.
            - uses: actions/checkout@v4
            # Install Node.js.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
            # Install NPM dependencies.
            - name: Install Node dependencies
              run: npm run install_npm
            # Building Angular and making the Electron application.
            # Une plateforme absente du manifeste produirait une application
            # qui ne démarre pas : getComponentPath lève au chargement des
            # constantes, avant la moindre fenêtre.
            - name: Verify components manifest
              run: node scripts/check-components.js win32
            # Le flux n'existe pas au premier passage : on ne demande les deltas
            # que s'il répond, sinon electron-winstaller échouerait sur un 404.
            - name: Probe Squirrel feed
              shell: bash
              run: |
                  if curl -sfI "$S3_ENDPOINT/$S3_BUCKET/$FEED_PREFIX/RELEASES" >/dev/null 2>&1; then
                    echo "SQUIRREL_REMOTE_RELEASES=$S3_ENDPOINT/$S3_BUCKET/$FEED_PREFIX" >> "$GITHUB_ENV"
                    echo "flux existant : paquets delta demandes"
                  else
                    echo "aucun flux : premier paquet, sans delta"
                  fi
            - name: Build Electron app
              run: npm run make
            # Publication du flux Squirrel. AUCUN client ne le lit encore : il
            # s'agit de constater que les paquets delta sont bien produits avant
            # d'y brancher l'updater.
            - name: Publish Squirrel feed
              shell: bash
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.COMPONENTS_S3_ACCESS_KEY }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.COMPONENTS_S3_SECRET_KEY }}
              run: bash .github/scripts/publish-squirrel-feed.sh
            # Rename the created binary.
            - name: Rename .exe
              run: |
                  $file = Get-ChildItem -Path "out/make/squirrel.windows/x64/" -Filter *.exe | Select-Object -First 1
                  Rename-Item -Path $file.FullName -NewName "EBP-Tools-$env:GITHUB_REF_NAME.exe"
            # Generate update metadata files
            - name: Generate update metadata
              run: node scripts/generate-update-metadata.js $env:GITHUB_REF_NAME win32
            # Upload the created binary.
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: windows
                  path: out/make/squirrel.windows/x64/*

    # Create the Linux version of the application.
    build-linux:
        runs-on: ubuntu-22.04
        needs: [test]
        steps:
            # Clone the repository.
            - uses: actions/checkout@v4
            # Install Node.js.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
            # Install NPM dependencies.
            - name: Install Node dependencies
              run: npm run install_npm
            # Building Angular and making the Electron application.
            # Une plateforme absente du manifeste produirait une application
            # qui ne démarre pas : getComponentPath lève au chargement des
            # constantes, avant la moindre fenêtre.
            - name: Verify components manifest
              run: node scripts/check-components.js linux
            - name: Build Electron app
              run: npm run make
            # Rename the created .deb.
            - name: Rename .deb
              run: |
                  file=$(find out/make -type f -name "*.deb" | head -n 1)
                  mv "$file" out/make/EBP-Tools-${GITHUB_REF_NAME}.deb
            # Upload the created binary.
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: linux
                  path: out/make/*.deb

    # Deploy the new version.
    deploy-builds:
        runs-on: ubuntu-latest
        needs: [build-windows, build-macos-arm64, build-macos-intel, build-linux]
        steps:
            # Retrieve the version number of the application.
            - name: Get version
              id: get_version
              run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            # Download the MacOS ARM64 binary created from the latest job.
            - name: Download macos-arm64 artifact
              uses: actions/download-artifact@v4
              with:
                  name: macos-arm64
                  path: ./release
            # Download the MacOS Intel (x64) binary created from the latest job.
            - name: Download macos-x64 artifact
              uses: actions/download-artifact@v4
              with:
                  name: macos-x64
                  path: ./release
            # Download the Windows binary created from the latest job.
            - name: Download Windows artifact
              uses: actions/download-artifact@v4
              with:
                  name: windows
                  path: ./release
            # Download the Linux binary created from the latest job.
            - name: Download Linux artifact
              uses: actions/download-artifact@v4
              with:
                  name: linux
                  path: ./release
            # Create a GitHub release.
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.get_version.outputs.version }}
                  name: Release ${{ steps.get_version.outputs.version }}
                  draft: false
                  prerelease: false
                  files: |
                      ./release/EBP-Tools-*.dmg
                      ./release/*.zip
                      ./release/EBP-Tools-*.exe
                      ./release/EBP-Tools-*.deb
                      ./release/RELEASES
                      ./release/*.nupkg
                      ./release/latest-mac.yml
                      ./release/latest.yml
