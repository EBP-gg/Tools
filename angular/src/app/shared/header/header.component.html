<!-- #region LEFT -->
<a class="logo" (click)="openURLExternalBrowser(globalService.webSiteURL)">
  <img
    height="24px"
    alt="EBP's logo"
    src="/assets/img/logo.svg"
    matTooltip="{{ 'shared.header.accessWebsite' | translate }}"
  />
</a>
<a
  class="btn squared"
  routerLink="/{{ translateService.getCurrentLang() }}"
  (click)="page = globalService.arenaModeRegistered ? 'arena_mode' : undefined"
  matTooltip="{{ 'shared.header.home' | translate }}"
>
  <i class="fa-sharp fa-solid fa-house"></i>
</a>
<mat-form-field matTooltip="{{ 'shared.header.changeTool' | translate }}">
  <mat-select [(ngModel)]="page" (selectionChange)="changeTool($event)">
    @for (page of pages; track page) {
      <mat-option
        [value]="page"
        [disabled]="globalService.arenaModeRegistered && page != 'arena_mode'"
      >
        {{ 'shared.header.tools.' + page | translate }}
      </mat-option>
    }
  </mat-select>
</mat-form-field>
<a
  class="btn squared discord"
  aria-label="Discord"
  (click)="openURLExternalBrowser(globalService.discordServerURL)"
  matTooltip="{{ 'shared.header.accessDiscordServer' | translate }}"
>
  <i class="fa-brands fa-discord"></i>
</a>
<!-- #endregion -->
<!-- #region RIGHT -->
<div class="right">
  <div class="language_selector">
    <img
      alt="Language flag"
      src="/assets/img/flags/{{ translateService.getCurrentLang() }}.webp"
    />
    <select
      aria-label="Language selector"
      (change)="languageSelectChanged($event)"
    >
      @for (lang of translateService.getLangs(); track lang) {
        <option
          value="{{ lang }}"
          [selected]="lang == translateService.getCurrentLang()"
        >
          {{ lang }}
        </option>
      }
    </select>
  </div>
</div>
<!-- #endregion -->
